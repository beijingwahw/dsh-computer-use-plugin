# 融合重构版 · DSH 加载覆盖层
# 注意：name 必须是本插件入口文件的绝对路径 ——
# patch 文件只贡献配置层，不改变 loader 解析模块路径的 profile 目录。
- insert:
    - id: computer-use-vision-plugin
      name: '/替换为你的绝对路径/computer-use-plugin/refactored/src/index.ts'
      # 全部字段均有代码默认值，以下为显式示例（可按部署裁剪）
      config:
        mouseSpeed: 1500            # 鼠标速度(ms)，越大越像人类
        compressWidth: 1440         # 纯视觉架构画质优先
        jpegQuality: 75
        gridDivisions: 10           # SoM 网格，0 关闭
        maxImageCount: 3            # 滑动窗口保留图片数
        maxConsecutiveFailures: 3   # 熔断阈值
        maxTextLength: 1000         # 单次输入上限
        enableElementIdMode: false  # 混合 ID 寻址模式（需无障碍 Provider）
        localVisionApi: ''          # 本地视觉模型，如 http://127.0.0.1:8000/parse_gui
