# 融合重构版 · DSH 加载覆盖层
# 注意：name 必须是本插件入口文件的绝对路径 ——
# patch 文件只贡献配置层，不改变 loader 解析模块路径的 profile 目录。
- insert:
    - id: computer-use-vision-plugin
      name: '/替换为你的绝对路径/computer-use-plugin/refactored/src/index.ts'
      # 全部字段均有代码默认值，以下为显式示例（可按部署裁剪）
      config:
        mouseSpeed: 1500            # 鼠标速度(ms)，越大越像人类
        compressWidth: 1440         # 纯视觉架构画质优先
        jpegQuality: 75
        gridDivisions: 10           # SoM 网格，0 关闭
        maxImageCount: 3            # 滑动窗口保留图片数
        maxConsecutiveFailures: 3   # 熔断阈值
        maxTextLength: 1000         # 单次输入上限
        enableElementIdMode: false  # 混合 ID 寻址模式（需无障碍 Provider）
        localVisionApi: ''          # 本地视觉模型，如 http://127.0.0.1:8000/parse_gui
        # ─── 世界级升级 ───
        verifyActions: true         # dHash 前后对比，检测盲点（点了没反应）
        actionSettleMs: 400         # 动作后等待 UI 响应再取指纹
        noopSimilarityThreshold: 0.97
        autoRemember: true          # 验证生效的点击自动写入 UI 记忆
        enableUIMemory: true        # remember_ui / recall_ui 工具
        uiMemoryCapacity: 200
        enableJournal: true         # 行动日志 + replay_actions
        journalPath: ''             # JSONL 落盘路径，留空仅内存
        replayMaxSteps: 100
        dryRun: false               # 干跑：只记录不执行，截图真实
        # ─── 第二轮优化创新 ───
        stableScreenDistance: 3     # 变化门控：指纹距离<=3 视为屏幕未变
        adaptiveSettle: true        # 自适应稳定等待（动画期不误判）
        # ─── 第三轮创新 ───
        regionVerifyRadius: 0.15    # 区域验证半径（屏幕比例），0 禁用
        focusMaxAgeMs: 30000        # 焦点有效期：点击后多久内输入可复用其坐标
        # ─── 第四轮创新 ───
        enableOcr: false            # 本地 OCR（find_text/read_text/语义核对），语言包首次需联网
        ocrLang: eng                # 'eng' 或 'chi_sim+eng'
